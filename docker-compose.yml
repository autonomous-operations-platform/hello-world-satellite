services:
  doris:
    image: apache/doris:all-in-one-4.1.3@sha256:82a5cabc7900ebcd3d080412d636c0cebd6602799fffe2605c652b2ea7d42609
    container_name: doris
    ports:
      - "9030:9030"   # MySQL-compatible query port
      - "8030:8030"   # FE HTTP / Web UI
      - "8040:8040"   # BE HTTP / stream load
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-be-storage:/opt/apache-doris/be/storage
    environment:
      # Quiet Doris's very chatty internal console logging (FE log4j
      # "RuntimeLogger ... INFO" lines + BE glog "I2026..." lines: tablet
      # scheduler, topic publish, checkpoints, etc.). The image appends
      # {FE,BE}_CONFIG_EXTRA to fe.conf/be.conf, and Doris takes the LAST value
      # for a duplicated key, so this overrides the built-in "sys_log_level =
      # INFO". Set DORIS_LOG_LEVEL=INFO to restore verbose logs.
      FE_CONFIG_EXTRA: "sys_log_level = ${DORIS_LOG_LEVEL:-WARN}"
      BE_CONFIG_EXTRA: "sys_log_level = ${DORIS_LOG_LEVEL:-WARN}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536


volumes:
  doris-fe-meta:
  doris-be-storage:
